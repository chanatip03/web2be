services:
  database:
    container_name: web2-database
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: web2
    ports:
      - "5432:5432"
    volumes:
      - ./databasepg:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U admin -d web2" ]
      interval: 10s
      timeout: 5s
      retries: 5
